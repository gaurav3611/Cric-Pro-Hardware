<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760">
<rect width="1120" height="760" fill="#ffffff"/>
<text x="30" y="38" font-size="20" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">Stage 6: where the power flows</text>
<text x="30" y="60" font-size="13" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">The cell is charged by the TP4056 and feeds the ESP32 through the switch and the diode.</text>
<rect x="40" y="240" width="140" height="210" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="2" fill-opacity="1"/>
<text x="104.0" y="337.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">LiPo cell</text>
<text x="104.0" y="355.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">3.7 V</text>
<text x="104.0" y="371.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">1500 mAh</text>
<circle cx="180" cy="280" r="8" fill="#c62828" stroke="none" stroke-width="1"/>
<text x="164" y="286" font-size="18" text-anchor="end" font-weight="bold" fill="#c62828" font-family="Helvetica, Arial, sans-serif">+</text>
<circle cx="180" cy="410" r="8" fill="#212121" stroke="none" stroke-width="1"/>
<text x="164" y="416" font-size="18" text-anchor="end" font-weight="bold" fill="#212121" font-family="Helvetica, Arial, sans-serif">-</text>
<rect x="250" y="230" width="220" height="230" rx="10" fill="#3b4a5a" stroke="none" stroke-width="1" fill-opacity="1"/>
<rect x="322.0" y="214" width="76" height="34" rx="6" fill="#b0b7bd" stroke="#6b7479" stroke-width="1" fill-opacity="1"/>
<text x="360.0" y="236" font-size="11" text-anchor="middle" font-weight="normal" fill="#263238" font-family="Helvetica, Arial, sans-serif">USB</text>
<text x="360.0" y="206" font-size="12" text-anchor="middle" font-weight="bold" fill="#2e7d32" font-family="Helvetica, Arial, sans-serif">Charge here</text>
<text x="360.0" y="341.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">TP4056</text>
<text x="360.0" y="359.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#cfd8dc" font-family="Helvetica, Arial, sans-serif">charger with</text>
<text x="360.0" y="373.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#cfd8dc" font-family="Helvetica, Arial, sans-serif">protection</text>
<circle cx="266" cy="280" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="280" y="284" font-size="12" text-anchor="start" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">B+</text>
<circle cx="266" cy="410" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="280" y="414" font-size="12" text-anchor="start" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">B-</text>
<circle cx="454" cy="280" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="440" y="284" font-size="12" text-anchor="end" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">OUT+</text>
<circle cx="454" cy="410" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="440" y="414" font-size="12" text-anchor="end" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">OUT-</text>
<path d="M180,280 L266,280" fill="none" stroke="#c62828" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M180,410 L266,410" fill="none" stroke="#212121" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="800" y="150" width="290" height="310" rx="12" fill="#1f2a44" stroke="none" stroke-width="1" fill-opacity="1"/>
<rect x="852" y="134" width="76" height="34" rx="6" fill="#b0b7bd" stroke="#6b7479" stroke-width="1" fill-opacity="1"/>
<text x="890" y="156" font-size="11" text-anchor="middle" font-weight="normal" fill="#263238" font-family="Helvetica, Arial, sans-serif">USB-C</text>
<text x="890" y="126" font-size="12" text-anchor="middle" font-weight="bold" fill="#1565c0" font-family="Helvetica, Arial, sans-serif">Program here</text>
<circle cx="816" cy="280" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="830" y="284" font-size="12" text-anchor="start" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">5V</text>
<circle cx="816" cy="410" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="830" y="414" font-size="12" text-anchor="start" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">GND</text>
<text x="1074" y="444" font-size="12" text-anchor="end" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">ESP32-C3 Super Mini</text>
<path d="M890,168 L890,206" fill="none" stroke="#ef9a9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M880,206 L900,206 L890,224 Z" fill="#ef9a9a"/>
<path d="M879,226 L901,226" fill="none" stroke="#ef9a9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M890,226 L890,280" fill="none" stroke="#ef9a9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="910" y="212" font-size="11" text-anchor="start" font-weight="normal" fill="#cfd8dc" font-family="Helvetica, Arial, sans-serif">the board's own diode:</text>
<text x="910" y="227" font-size="11" text-anchor="start" font-weight="normal" fill="#cfd8dc" font-family="Helvetica, Arial, sans-serif">USB power can flow in,</text>
<text x="910" y="242" font-size="11" text-anchor="start" font-weight="normal" fill="#cfd8dc" font-family="Helvetica, Arial, sans-serif">nothing flows back out</text>
<path d="M856,280 L970,280" fill="none" stroke="#ef9a9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="890" cy="280" r="6" fill="#ef9a9a" stroke="none" stroke-width="1"/>
<rect x="970" y="261" width="100" height="38" rx="4" fill="#37474f" stroke="#90a4ae" stroke-width="1" fill-opacity="1"/>
<text x="1020" y="277" font-size="12" text-anchor="middle" font-weight="normal" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">regulator</text>
<text x="1020" y="292" font-size="11" text-anchor="middle" font-weight="normal" fill="#cfd8dc" font-family="Helvetica, Arial, sans-serif">to 3.3 V</text>
<path d="M1020,299 L1020,342" fill="none" stroke="#ffcc80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1020" y="360" font-size="11" text-anchor="middle" font-weight="normal" fill="#ffcc80" font-family="Helvetica, Arial, sans-serif">3.3 V to the chip</text>
<text x="1020" y="375" font-size="11" text-anchor="middle" font-weight="normal" fill="#ffcc80" font-family="Helvetica, Arial, sans-serif">and to the sensor</text>
<path d="M454,280 L540,280" fill="none" stroke="#c62828" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="548" cy="280" r="5" fill="#ffffff" stroke="#17221c" stroke-width="2"/>
<circle cx="592" cy="280" r="5" fill="#ffffff" stroke="#17221c" stroke-width="2"/>
<path d="M552,277 L590,264" fill="none" stroke="#17221c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="570" y="256" font-size="12" text-anchor="middle" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">SW1</text>
<path d="M600,280 L650,280" fill="none" stroke="#c62828" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M650,267 L650,293 L676,280 Z" fill="#17221c"/>
<path d="M678,266 L678,294" fill="none" stroke="#17221c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="664" y="258" font-size="12" text-anchor="middle" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">D1</text>
<path d="M680,280 L816,280" fill="none" stroke="#c62828" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M454,410 L816,410" fill="none" stroke="#212121" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="110" y="478" font-size="12" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">3.3 to 4.2 V</text>
<text x="110" y="494" font-size="12" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">Red lead is +</text>
<text x="360" y="488" font-size="12" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">Charges the cell to 4.2 V.</text>
<text x="360" y="504" font-size="12" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">Cuts off below 2.4 V</text>
<text x="360" y="520" font-size="12" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">and above 3 A.</text>
<text x="570" y="310" font-size="12" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">SW1 slide switch</text>
<text x="570" y="326" font-size="12" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">off: nothing flows</text>
<text x="700" y="310" font-size="12" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">D1 diode 1N5817</text>
<text x="700" y="326" font-size="12" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">striped end</text>
<text x="700" y="342" font-size="12" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">towards the ESP32</text>
<text x="740" y="266" font-size="12" text-anchor="middle" font-weight="bold" fill="#c62828" font-family="Helvetica, Arial, sans-serif">3.0 to 3.9 V</text>
<text x="640" y="432" font-size="12" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">ground: from OUT-, never from B-</text>
<rect x="30" y="550" width="1060" height="186" rx="8" fill="#f3f5f1" stroke="#dde4dc" stroke-width="1" fill-opacity="1"/>
<text x="50" y="578" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">Why the diode. The ESP32 board joins its 5V pin to its USB socket through a diode of its own. Without D1, plugging in that USB cable</text>
<text x="50" y="597" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">would push 5 volts straight into the cell, with nothing to limit the current. D1 lets current flow out of the battery only.</text>
<text x="50" y="616" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">With D1 fitted, the battery and the ESP32's USB cable can be connected at the same time. Whichever gives the higher voltage feeds the board.</text>
<text x="50" y="650" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">Charging. Plug a phone charger into the TP4056's own socket, with the switch off. One light shows while it charges, the other when it is full.</text>
<text x="50" y="669" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">Ground. B- is the cell's own minus. OUT- is the same point after the protection switch. Everything else connects to OUT-, so the protection can act.</text>
<text x="50" y="688" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">Voltage. The diode costs about 0.3 V and the regulator needs about 0.1 V more than it gives. The board runs properly down to a cell voltage of about 3.5 V.</text>
<text x="50" y="722" font-size="12" text-anchor="start" font-weight="bold" fill="#b0271f" font-family="Helvetica, Arial, sans-serif">Without D1: never have the battery switched on and the ESP32's USB cable plugged in at the same time.</text>
</svg>
