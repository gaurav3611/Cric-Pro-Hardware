<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700">
<rect width="1100" height="700" fill="#ffffff"/>
<text x="30" y="38" font-size="20" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">Impact sensor, a proposal: a piezo disc, no diodes needed</text>
<text x="30" y="60" font-size="13" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">The firmware does not read it yet. It works the same with or without the diode in the power path.</text>
<rect x="40" y="150" width="200" height="24" rx="10" fill="#c8a165" stroke="#8d6e3a" stroke-width="2" fill-opacity="1"/>
<text x="140" y="140" font-size="12" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">handle</text>
<rect x="240" y="118" width="500" height="88" rx="18" fill="#e8d3a8" stroke="#8d6e3a" stroke-width="2" fill-opacity="1"/>
<text x="720" y="108" font-size="12" text-anchor="end" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">toe</text>
<rect x="262" y="136" width="120" height="52" rx="6" fill="#1f2a44" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="322" y="158" font-size="11" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">ESP32 + BMI160</text>
<text x="322" y="173" font-size="11" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">on the zero PCB</text>
<circle cx="590" cy="162" r="24" fill="#d4af37" stroke="#8d6e00" stroke-width="2"/>
<circle cx="590" cy="162" r="13" fill="#eceff1" stroke="#8d6e00" stroke-width="1"/>
<text x="590" y="232" font-size="12" text-anchor="middle" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">PZ1 on the back of the blade, at the middle</text>
<text x="590" y="249" font-size="12" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">roughly 15 to 20 cm from the toe</text>
<path d="M566,156 L382,156" fill="none" stroke="#c62828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M566,170 L382,170" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="474" y="148" font-size="11" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">two thin wires, taped down</text>
<text x="40" y="312" font-size="15" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">The circuit</text>
<rect x="95" y="400" width="50" height="40" rx="6" fill="#eceff1" stroke="#8d6e00" stroke-width="2" fill-opacity="1"/>
<text x="120" y="425" font-size="12" text-anchor="middle" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">PZ1</text>
<text x="156" y="396" font-size="11" text-anchor="start" font-weight="normal" fill="#c62828" font-family="Helvetica, Arial, sans-serif">red</text>
<text x="156" y="456" font-size="11" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">black</text>
<path d="M120,400 L120,360 L560,360" fill="none" stroke="#c62828" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M120,440 L120,500 L380,500" fill="none" stroke="#212121" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M120,500 L120,510" fill="none" stroke="#212121" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M107,510 L133,510" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M112,516 L128,516" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M117,522 L123,522" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="240" cy="360" r="6" fill="#c62828" stroke="none" stroke-width="1"/>
<path d="M240,360 L240,416" fill="none" stroke="#c62828" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M227,416 L253,416" fill="none" stroke="#17221c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M227,424 L253,424" fill="none" stroke="#17221c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="260" y="418" font-size="12" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">C3</text>
<text x="260" y="433" font-size="11" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">100 nF</text>
<path d="M240,424 L240,500" fill="none" stroke="#212121" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="240" cy="500" r="6" fill="#212121" stroke="none" stroke-width="1"/>
<circle cx="360" cy="360" r="6" fill="#c62828" stroke="none" stroke-width="1"/>
<path d="M360,360 L360,396" fill="none" stroke="#c62828" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="351" y="396" width="18" height="60" rx="2" fill="#ffffff" stroke="#17221c" stroke-width="2" fill-opacity="1"/>
<text x="378" y="424.0" font-size="12" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">R4</text>
<text x="378" y="440.0" font-size="11" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">1 M</text>
<path d="M360,456 L360,500" fill="none" stroke="#212121" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="360" cy="500" r="6" fill="#212121" stroke="none" stroke-width="1"/>
<rect x="200" y="330" width="210" height="200" rx="10" fill="none" stroke="#58675e" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="305" y="548" font-size="11" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">solder these two at the disc</text>
<rect x="470" y="351" width="60" height="18" rx="2" fill="#ffffff" stroke="#17221c" stroke-width="2" fill-opacity="1"/>
<text x="500.0" y="344" font-size="12" text-anchor="middle" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">R3</text>
<text x="500.0" y="387" font-size="11" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">100 k</text>
<path d="M530,360 L600,360" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="600" y="343" width="140" height="34" rx="6" fill="#1f2a44" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="670" y="365" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">ESP32 GPIO1</text>
<text x="500" y="412" font-size="11" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">near the ESP32</text>
<text x="120" y="552" font-size="12" text-anchor="middle" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">GND of the ESP32</text>
<rect x="780" y="96" width="290" height="470" rx="8" fill="#f3f5f1" stroke="#dde4dc" stroke-width="1" fill-opacity="1"/>
<text x="798" y="124" font-size="14" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">Why no diode is needed</text>
<text x="798" y="150" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">A hard hit can make the disc give</text>
<text x="798" y="167" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">tens of volts. C3 sits across it and</text>
<text x="798" y="184" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">takes most of that charge: the voltage</text>
<text x="798" y="201" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">falls to about a sixth.</text>
<text x="798" y="218" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif"></text>
<text x="798" y="235" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">R3 then lets only a fraction of a</text>
<text x="798" y="252" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">milliamp into the pin, which the pin's</text>
<text x="798" y="269" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">own protection inside the chip takes.</text>
<text x="798" y="286" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif"></text>
<text x="798" y="303" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">R4 empties the disc after each hit.</text>
<text x="798" y="320" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">The reading is back at zero in about</text>
<text x="798" y="337" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">a tenth of a second.</text>
<text x="798" y="354" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif"></text>
<text x="798" y="371" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">GPIO1 is free: GPIO0 measures the</text>
<text x="798" y="388" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">battery, GPIO3 and GPIO4 talk to</text>
<text x="798" y="405" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">the BMI160.</text>
<text x="798" y="446" font-size="14" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">On the zero PCB</text>
<text x="798" y="472" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">R3's free end in J8, joined to I8</text>
<text x="798" y="489" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">(GPIO1) with a blob of solder.</text>
<text x="798" y="506" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">The black wire in F14, joined to</text>
<text x="798" y="523" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">G14 (GND) the same way.</text>
<text x="798" y="540" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">Both holes are free in both layouts.</text>
<rect x="30" y="590" width="1040" height="90" rx="8" fill="#f3f5f1" stroke="#dde4dc" stroke-width="1" fill-opacity="1"/>
<text x="48" y="616" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">PZ1: plain piezo disc, 27 mm, with two wires. Not a buzzer module.   C3: 100 nF ceramic, printed 104.   R4: 1 megohm (brown, black, green).</text>
<text x="48" y="638" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">R3: 100 kilohm (brown, black, yellow), the same as R1 and R2.   Glue the disc flat with epoxy, brass side down, and tape over it.</text>
<text x="48" y="660" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">Calibrate it with real hits: record a few on the middle, the edge and the toe with the phone app, and compare the readings.</text>
</svg>
