<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640">
<rect width="1240" height="640" fill="#ffffff"/>
<text x="30" y="38" font-size="20" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">How the bat and the dashboard find each other over Bluetooth</text>
<text x="30" y="60" font-size="13" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">Bluetooth Low Energy. The bat is the peripheral: it holds the data. The browser is the central: it connects and listens.</text>
<rect x="30" y="90" width="520" height="526" rx="8" fill="#f3f5f1" stroke="#dde4dc" stroke-width="1" fill-opacity="1"/>
<text x="50" y="120" font-size="14" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">What the bat offers</text>
<rect x="50" y="140" width="480" height="46" rx="8" fill="#1f2a44" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="66" y="169" font-size="12" text-anchor="start" font-weight="normal" fill="#cfd8dc" font-family="Helvetica, Arial, sans-serif">Device</text>
<text x="130" y="169" font-size="15" text-anchor="start" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">SwingLab-Bat</text>
<path d="M80,186 L80,240 L100,240" fill="none" stroke="#58675e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="100" y="212" width="430" height="56" rx="8" fill="#34495e" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="116" y="234" font-size="12" text-anchor="start" font-weight="normal" fill="#cfd8dc" font-family="Helvetica, Arial, sans-serif">Service: a folder of values</text>
<text x="116" y="256" font-size="13" text-anchor="start" font-weight="bold" fill="#ffffff" font-family="Menlo, Consolas, monospace">4fafc201-1fb5-459e-8fcc-c5c9c331914b</text>
<path d="M130,268 L130,322 L150,322" fill="none" stroke="#58675e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="150" y="286" width="380" height="92" rx="8" fill="#2f5d50" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="166" y="308" font-size="12" text-anchor="start" font-weight="normal" fill="#d5e5de" font-family="Helvetica, Arial, sans-serif">Characteristic: one value</text>
<text x="166" y="330" font-size="12" text-anchor="start" font-weight="bold" fill="#ffffff" font-family="Menlo, Consolas, monospace">beb5483e-36e1-4688-b7f5-ea07361b26a8</text>
<text x="166" y="351" font-size="12" text-anchor="start" font-weight="normal" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">14 bytes: the newest reading</text>
<text x="166" y="369" font-size="12" text-anchor="start" font-weight="normal" fill="#d5e5de" font-family="Helvetica, Arial, sans-serif">can be read, and is pushed (notify)</text>
<path d="M80,240 L80,438 L100,438" fill="none" stroke="#58675e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="100" y="410" width="430" height="56" rx="8" fill="#34495e" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="116" y="432" font-size="12" text-anchor="start" font-weight="normal" fill="#cfd8dc" font-family="Helvetica, Arial, sans-serif">Service 0x180F: battery, the standard one</text>
<text x="116" y="454" font-size="12" text-anchor="start" font-weight="normal" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">only with the stage 7 parts</text>
<path d="M130,466 L130,514 L150,514" fill="none" stroke="#58675e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="150" y="484" width="380" height="60" rx="8" fill="#2f5d50" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="166" y="506" font-size="12" text-anchor="start" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">Characteristic 0x2A19</text>
<text x="166" y="528" font-size="12" text-anchor="start" font-weight="normal" fill="#d5e5de" font-family="Helvetica, Arial, sans-serif">1 byte: charge in percent, 0 to 100</text>
<text x="50" y="572" font-size="12" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">The long ids were picked at random, once. They only have to be the same</text>
<text x="50" y="590" font-size="12" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">in the firmware (config.h) and in the web app (sensor-packet.ts).</text>
<circle cx="606" cy="116" r="15" fill="#1f2a44" stroke="none" stroke-width="1"/>
<text x="606" y="121" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">1</text>
<text x="634" y="114" font-size="14" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">The bat advertises</text>
<text x="634" y="134" font-size="12" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">A few times a second it broadcasts: my name is SwingLab-Bat, and I offer service 4fafc201.</text>
<text x="634" y="151" font-size="12" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">Its light blinks slowly.</text>
<circle cx="606" cy="190" r="15" fill="#1f2a44" stroke="none" stroke-width="1"/>
<text x="606" y="195" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">2</text>
<text x="634" y="188" font-size="14" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">You press Connect Sensor</text>
<text x="634" y="208" font-size="12" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">The browser lists nearby devices whose name starts with SwingLab. A web page may only see</text>
<text x="634" y="225" font-size="12" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">what you pick yourself.</text>
<circle cx="606" cy="264" r="15" fill="#1f2a44" stroke="none" stroke-width="1"/>
<text x="606" y="269" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">3</text>
<text x="634" y="262" font-size="14" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">The browser connects</text>
<text x="634" y="282" font-size="12" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">From now on the two take turns many times a second. The bat stops advertising and its light</text>
<text x="634" y="299" font-size="12" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">stays on.</text>
<circle cx="606" cy="338" r="15" fill="#1f2a44" stroke="none" stroke-width="1"/>
<text x="606" y="343" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">4</text>
<text x="634" y="336" font-size="14" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">The page finds the value</text>
<text x="634" y="356" font-size="12" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">It asks for the service by its id, then for the characteristic by its id.</text>
<circle cx="606" cy="412" r="15" fill="#1f2a44" stroke="none" stroke-width="1"/>
<text x="606" y="417" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">5</text>
<text x="634" y="410" font-size="14" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">The page asks for notifications</text>
<text x="634" y="430" font-size="12" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">It flips a small switch on the characteristic that means: push me every new value.</text>
<circle cx="606" cy="486" r="15" fill="#1f2a44" stroke="none" stroke-width="1"/>
<text x="606" y="491" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">6</text>
<text x="634" y="484" font-size="14" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">The bat sends 14 bytes every 20 ms</text>
<text x="634" y="504" font-size="12" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">Nobody has to ask again. The dashboard uses a packet only while a shot is being recorded.</text>
<circle cx="606" cy="560" r="15" fill="#1f2a44" stroke="none" stroke-width="1"/>
<text x="606" y="565" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">7</text>
<text x="634" y="558" font-size="14" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">The connection ends</text>
<text x="634" y="578" font-size="12" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">The page closes or goes out of range. The bat starts advertising again by itself.</text>
</svg>
