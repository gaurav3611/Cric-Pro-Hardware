<circle cx="620" cy="234" r="6" fill="#212121" stroke="none" stroke-width="1"/>
<text x="265" y="494" font-size="11" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">The light is on GPIO8 and the BOOT button on GPIO9.</text>
<text x="780" y="434" font-size="11" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">Leave 3V3, CS, INT1, INT2 and OCS unconnected.</text>
<rect x="30" y="510" width="940" height="106" rx="8" fill="#f3f5f1" stroke="#dde4dc" stroke-width="1" fill-opacity="1"/>
<path d="M50,536 L84,536" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="94" y="541" font-size="13" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">3V3  to  VIN</text>
<text x="94" y="559" font-size="12" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">power, 3.3 volts</text>
<path d="M280,536 L314,536" fill="none" stroke="#212121" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="324" y="541" font-size="13" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">GND  to  GND</text>
<text x="324" y="559" font-size="12" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">ground</text>
<path d="M510,536 L544,536" fill="none" stroke="#e68a00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="554" y="541" font-size="13" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">GPIO4  to  SCL</text>
<text x="554" y="559" font-size="12" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">I2C clock</text>
<path d="M740,536 L774,536" fill="none" stroke="#1565c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="784" y="541" font-size="13" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">GPIO3  to  SDA</text>
<text x="784" y="559" font-size="12" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">I2C data</text>
<path d="M50,590 L84,590" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="94" y="595" font-size="13" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">SAO  to  GND</text>
<text x="196" y="595" font-size="12" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">fixes the sensor's address at 0x68. Left open it is usually 0x69, which also works.</text>
<text x="950" y="595" font-size="12" text-anchor="end" font-weight="normal" fill="#b0271f" font-family="Helvetica, Arial, sans-serif">Power the sensor from 3V3, never from 5V.</text>
</svg>
