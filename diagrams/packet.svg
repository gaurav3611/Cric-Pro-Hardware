<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600">
<rect width="1240" height="600" fill="#ffffff"/>
<text x="30" y="38" font-size="20" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">The 14-byte packet</text>
<text x="30" y="60" font-size="13" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">What the bat sends 50 times a second, and how the dashboard reads it. The example was taken during a swing.</text>
