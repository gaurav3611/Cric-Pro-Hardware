<text x="337.0" y="100" font-size="11" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">byte 3</text>
<rect x="380" y="110" width="74" height="52" rx="6" fill="#f3f5f1" stroke="#dde4dc" stroke-width="1" fill-opacity="1"/>
