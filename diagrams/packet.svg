<rect x="700" y="110" width="74" height="52" rx="6" fill="#f3f5f1" stroke="#dde4dc" stroke-width="1" fill-opacity="1"/>
<text x="737.0" y="143" font-size="20" text-anchor="middle" font-weight="bold" fill="#17221c" font-family="Menlo, Consolas, monospace">06</text>
<text x="737.0" y="100" font-size="11" text-anchor="middle" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">byte 8</text>
<rect x="780" y="110" width="74" height="52" rx="6" fill="#f3f5f1" stroke="#dde4dc" stroke-width="1" fill-opacity="1"/>
