<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
<rect width="1000" height="640" fill="#ffffff"/>
<text x="30" y="38" font-size="20" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">The ESP32-C3 Super Mini and what this kit uses each pin for</text>
<text x="30" y="60" font-size="13" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">Seen from the top, USB socket up. The labels are printed on the underside of the real board.</text>
<rect x="385" y="120" width="230" height="360" rx="14" fill="#1f2a44" stroke="none" stroke-width="1" fill-opacity="1"/>
<rect x="462.0" y="104" width="76" height="34" rx="6" fill="#b0b7bd" stroke="#6b7479" stroke-width="1" fill-opacity="1"/>
<text x="500.0" y="126" font-size="11" text-anchor="middle" font-weight="normal" fill="#263238" font-family="Helvetica, Arial, sans-serif">USB-C</text>
<text x="500.0" y="292.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">ESP32-C3</text>
<text x="500.0" y="314.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#cfd8dc" font-family="Helvetica, Arial, sans-serif">Super Mini</text>
<rect x="466.0" y="428" width="68" height="40" rx="4" fill="#37474f" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="500.0" y="453" font-size="11" text-anchor="middle" font-weight="normal" fill="#cfd8dc" font-family="Helvetica, Arial, sans-serif">antenna</text>
<circle cx="401" cy="172" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="415" y="176" font-size="12" text-anchor="start" font-weight="normal" fill="#90a4ae" font-family="Helvetica, Arial, sans-serif">GPIO5</text>
<circle cx="401" cy="208" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="415" y="212" font-size="12" text-anchor="start" font-weight="normal" fill="#90a4ae" font-family="Helvetica, Arial, sans-serif">GPIO6</text>
<circle cx="401" cy="244" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="415" y="248" font-size="12" text-anchor="start" font-weight="normal" fill="#90a4ae" font-family="Helvetica, Arial, sans-serif">GPIO7</text>
<circle cx="401" cy="280" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="415" y="284" font-size="12" text-anchor="start" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">GPIO8</text>
<circle cx="401" cy="316" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="415" y="320" font-size="12" text-anchor="start" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">GPIO9</text>
<circle cx="401" cy="352" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="415" y="356" font-size="12" text-anchor="start" font-weight="normal" fill="#90a4ae" font-family="Helvetica, Arial, sans-serif">GPIO10</text>
<circle cx="401" cy="388" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="415" y="392" font-size="12" text-anchor="start" font-weight="normal" fill="#90a4ae" font-family="Helvetica, Arial, sans-serif">GPIO20</text>
<circle cx="401" cy="424" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="415" y="428" font-size="12" text-anchor="start" font-weight="normal" fill="#90a4ae" font-family="Helvetica, Arial, sans-serif">GPIO21</text>
<circle cx="599" cy="172" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="585" y="176" font-size="12" text-anchor="end" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">5V</text>
<circle cx="599" cy="208" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="585" y="212" font-size="12" text-anchor="end" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">GND</text>
<circle cx="599" cy="244" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="585" y="248" font-size="12" text-anchor="end" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">3V3</text>
<circle cx="599" cy="280" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="585" y="284" font-size="12" text-anchor="end" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">GPIO4</text>
<circle cx="599" cy="316" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="585" y="320" font-size="12" text-anchor="end" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">GPIO3</text>
<circle cx="599" cy="352" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="585" y="356" font-size="12" text-anchor="end" font-weight="normal" fill="#90a4ae" font-family="Helvetica, Arial, sans-serif">GPIO2</text>
<circle cx="599" cy="388" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="585" y="392" font-size="12" text-anchor="end" font-weight="normal" fill="#90a4ae" font-family="Helvetica, Arial, sans-serif">GPIO1</text>
<circle cx="599" cy="424" r="7" fill="#d4af37" stroke="#8d6e00" stroke-width="1"/>
<text x="585" y="428" font-size="12" text-anchor="end" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">GPIO0</text>
<path d="M611,172 L659,172" fill="none" stroke="#c62828" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="671" y="171" font-size="13" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">power in</text>
<text x="671" y="186" font-size="11" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">from the battery, through the switch and the diode</text>
<path d="M611,208 L659,208" fill="none" stroke="#212121" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="671" y="207" font-size="13" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">ground</text>
<text x="671" y="222" font-size="11" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">the common return of every part</text>
<path d="M611,244 L659,244" fill="none" stroke="#c62828" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="671" y="243" font-size="13" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">power out, 3.3 volts</text>
<text x="671" y="258" font-size="11" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">made by the board's regulator. Feeds the sensor.</text>
<path d="M611,280 L659,280" fill="none" stroke="#e68a00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="671" y="279" font-size="13" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">I2C clock, SCL</text>
<text x="671" y="294" font-size="11" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">to the sensor</text>
<path d="M611,316 L659,316" fill="none" stroke="#1565c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="671" y="315" font-size="13" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">I2C data, SDA</text>
<text x="671" y="330" font-size="11" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">to the sensor</text>
<path d="M611,352 L659,352" fill="none" stroke="#8a959b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="671" y="351" font-size="13" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">leave free</text>
<text x="671" y="366" font-size="11" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">the chip reads it at power-on to decide how to start</text>
<path d="M611,388 L659,388" fill="none" stroke="#8a959b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="671" y="387" font-size="13" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">free</text>
<text x="671" y="402" font-size="11" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">can measure a voltage, like GPIO0</text>
<path d="M611,424 L659,424" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="671" y="423" font-size="13" text-anchor="start" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">battery voltage, stage 7</text>
<text x="671" y="438" font-size="11" text-anchor="start" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">optional. Through two resistors, never directly.</text>
<path d="M389,172 L341,172" fill="none" stroke="#8a959b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="329" y="176" font-size="13" text-anchor="end" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">free</text>
<path d="M389,208 L341,208" fill="none" stroke="#8a959b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="329" y="212" font-size="13" text-anchor="end" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">free</text>
<path d="M389,244 L341,244" fill="none" stroke="#8a959b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="329" y="248" font-size="13" text-anchor="end" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">free</text>
<path d="M389,280 L341,280" fill="none" stroke="#1565c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="329" y="284" font-size="13" text-anchor="end" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">the blue light on the board. LOW = on</text>
<path d="M389,316 L341,316" fill="none" stroke="#e68a00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="329" y="320" font-size="13" text-anchor="end" font-weight="bold" fill="#17221c" font-family="Helvetica, Arial, sans-serif">the BOOT button. Pressed = LOW</text>
<path d="M389,352 L341,352" fill="none" stroke="#8a959b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="329" y="356" font-size="13" text-anchor="end" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">free</text>
<path d="M389,388 L341,388" fill="none" stroke="#8a959b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="329" y="392" font-size="13" text-anchor="end" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">free (serial RX)</text>
<path d="M389,424 L341,424" fill="none" stroke="#8a959b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="329" y="428" font-size="13" text-anchor="end" font-weight="normal" fill="#58675e" font-family="Helvetica, Arial, sans-serif">free (serial TX)</text>
<rect x="30" y="520" width="940" height="96" rx="8" fill="#f3f5f1" stroke="#dde4dc" stroke-width="1" fill-opacity="1"/>
<text x="48" y="546" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">GPIO8 and GPIO9 are already used on the board itself, by the light and the button. Do not wire anything else to them.</text>
<text x="48" y="568" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">GPIO2, GPIO8 and GPIO9 are read by the chip at the moment it gets power. A part that pulls one of them the wrong way stops it from starting.</text>
<text x="48" y="590" font-size="12" text-anchor="start" font-weight="normal" fill="#17221c" font-family="Helvetica, Arial, sans-serif">Every pin works at 3.3 volts. Never connect 5 volts or the battery directly to a GPIO pin.</text>
</svg>
